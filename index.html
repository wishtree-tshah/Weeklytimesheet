<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Insights Report</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS for parsing Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-logo {
            height: 40px;
            width: auto;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 10px 0;
            letter-spacing: -0.025em;
        }

        .header p {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin: 0;
        }

        .upload-section {
            background: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 40px;
            position: relative;
        }

        .upload-section:hover {
            border-color: var(--primary-color);
            background: #F3F4F6;
        }

        .upload-section.drag-over {
            border-color: var(--primary-color);
            background: #EEF2FF;
        }

        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .upload-hint {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .upload-filename {
            margin-top: 14px;
            font-size: 0.9rem;
            color: var(--text-muted);
            position: relative;
        }

        .upload-loading {
            display: none;
            position: relative;
        }

        .upload-loading.active {
            display: block;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .results-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .results-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .btn-copy {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-copy:hover {
            background-color: var(--primary-hover);
        }

        /* The tables that users will copy-paste */
        .table-container {
            overflow-x: auto;
            /* Removed flex layout as it fundamentally breaks html2canvas positioning logic and creates giant PDF gaps */
        }

        table {
            width: calc(100% - 10px);
            /* Shrunk by 10px to ensure Friday column border renders strictly inside PDF bounds */
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
            border: 1px solid #111827;
            /* Table-layout defaults to 'auto' to tightly hug width: 1% day columns */
        }

        th,
        td {
            padding: 8px 12px;
            border: 1px solid #111827;
            color: #111827;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
            /* Allows long task strings to wrap cleanly */
        }

        /* Top header row */
        thead tr:first-child th {
            background-color: #A3B5C9;
        }

        thead tr:first-child th:nth-child(1),
        thead tr:first-child th:nth-child(2) {
            background-color: #DDE3EA;
        }

        /* Second header row */
        thead tr.second-header-row th {
            background-color: #617D98;
            color: white;
            font-weight: 500;
            font-style: italic;
        }

        /* Weekend day columns are muted since they normally carry no logged hours */
        thead tr.second-header-row th.weekend-col {
            background-color: #8A9DB1;
            color: #E5EAF0;
        }

        /* Grand Total */
        .total-row td {
            background-color: #CCD6E0;
            font-weight: 700;
        }

        /* Longer date ranges add more fixed-width day columns, which squeezes the
           Tasks column and inflates row heights (and PDF page count). This shrinks
           the per-user tables once the range exceeds a normal work week. */
        .compact-table th,
        .compact-table td {
            padding: 4px 6px;
            font-size: 0.78rem;
        }

        /* Non-blocking notifications, replacing native alert() popups for warnings/notices */
        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
        }

        .toast {
            background: #fff;
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
            padding: 14px 16px;
            font-size: 0.9rem;
            color: var(--text-main);
            animation: toastIn 0.25s ease-out;
        }

        .toast-message {
            white-space: pre-line;
        }

        .toast.toast-error {
            border-left-color: #DC2626;
        }

        .toast.toast-warning {
            border-left-color: #D97706;
        }

        .toast-close {
            float: right;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 700;
            margin-left: 12px;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>

    <script>
        const WISHTREE_LOGO_DATA_URI = document.querySelector('.header-logo').src;

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'warning' ? ' toast-warning' : '');

            const closeBtn = document.createElement('span');
            closeBtn.className = 'toast-close';
            closeBtn.textContent = '×';
            closeBtn.onclick = () => toast.remove();

            const textEl = document.createElement('div');
            textEl.className = 'toast-message';
            textEl.textContent = message; // textContent keeps this safe against HTML in file-sourced data

            toast.appendChild(closeBtn);
            toast.appendChild(textEl);
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, type === 'error' ? 10000 : 8000);
        }

        function showCopyFeedback(btn) {
            if (!btn) return;
            const originalText = btn.innerHTML;
            const originalBg = btn.style.backgroundColor;
            btn.innerHTML = '✅ Copied!';
            btn.style.backgroundColor = '#059669';
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.backgroundColor = originalBg;
            }, 2000);
        }

        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.querySelector('.upload-section');
        const uploadLoading = document.getElementById('uploadLoading');
        const uploadIdle = document.getElementById('uploadIdle');
        const uploadFilename = document.getElementById('uploadFilename');

        // Visual feedback while dragging a file over the drop zone (the underlying
        // file input already accepts the drop natively - this only adds the highlight).
        ['dragenter', 'dragover'].forEach(evt => {
            uploadSection.addEventListener(evt, (e) => {
                e.preventDefault();
                uploadSection.classList.add('drag-over');
            });
        });
        ['dragleave', 'drop'].forEach(evt => {
            uploadSection.addEventListener(evt, (e) => {
                e.preventDefault();
                uploadSection.classList.remove('drag-over');
            });
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadFilename.textContent = `Selected: ${file.name}`;
            uploadLoading.classList.add('active');
            uploadIdle.style.display = 'none';

            const reader = new FileReader();

            reader.onerror = function () {
                uploadLoading.classList.remove('active');
                uploadIdle.style.display = '';
                fileInput.value = '';
                showToast('Could not read the selected file. Please try again.', 'error');
            };

            reader.onload = function (evt) {
                try {
                    const data = evt.target.result;

                    // read with raw:false to keep formatted text
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true, dateNF: 'dd-mm-yyyy' });

                    // Search every sheet for the one containing the "Date" header row,
                    // rather than assuming the consolidated sheet is always first.
                    let rawData = null;
                    let winningSheetName = null;
                    let headerRowIdx = -1;
                    let headers = [];
                    for (const sheetName of workbook.SheetNames) {
                        const worksheet = workbook.Sheets[sheetName];
                        const sheetData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: '-' });
                        for (let i = 0; i < sheetData.length; i++) {
                            if (sheetData[i] && sheetData[i].map(c => String(c).trim()).includes("Date")) {
                                rawData = sheetData;
                                winningSheetName = sheetName;
                                headerRowIdx = i;
                                headers = sheetData[i].map(c => String(c).trim());
                                break;
                            }
                        }
                        if (headerRowIdx !== -1) break;
                    }

                    if (headerRowIdx === -1) {
                        showToast("Could not find the 'Date' header in the file. Is this the right format?", 'error');
                        return;
                    }

                    // Some rows (typically ones added/edited by hand in Excel) store the Date
                    // cell as an actual Excel date rather than the plain "DD-MM-YYYY" text the
                    // rest of the export uses, which the dateNF fallback above can't reach since
                    // it only applies to cells with no format of their own. Re-parse the sheet
                    // without cellDates so those cells stay a raw serial number, and convert via
                    // XLSX.SSF.format rather than a JS Date object - round-tripping through a
                    // Date and reading its fields back out is timezone-sensitive and can shift
                    // the calendar day by one for users east of UTC.
                    const rawWorkbook = XLSX.read(data, { type: 'array' });
                    const rawWorksheet = rawWorkbook.Sheets[winningSheetName];
                    const rawDataTyped = XLSX.utils.sheet_to_json(rawWorksheet, { header: 1, raw: true, defval: '-' });
                    const dateColIdx = headers.indexOf('Date');

                    // Pull the authoritative "TIME PERIOD : dd-mm-yyyy To dd-mm-yyyy" metadata row
                    // (more reliable than inferring the range from whichever dates have logged entries,
                    // since a day with no entries yet would otherwise silently shrink the reported range).
                    let officialPeriodStart = null;
                    let officialPeriodEnd = null;
                    for (let i = 0; i < headerRowIdx; i++) {
                        const metaRow = rawData[i];
                        if (metaRow && String(metaRow[0] || '').trim().toUpperCase().startsWith('TIME PERIOD')) {
                            const match = String(metaRow[1] || '').match(/(\d{2}-\d{2}-\d{4})\s*To\s*(\d{2}-\d{2}-\d{4})/i);
                            if (match) {
                                officialPeriodStart = match[1];
                                officialPeriodEnd = match[2];
                            }
                            break;
                        }
                    }

                    // Parse Data
                    const parsedData = [];
                    for (let i = headerRowIdx + 1; i < rawData.length; i++) {
                        let rowObj = {};
                        if (rawData[i].every(c => c === '-')) continue; // Skip empty rows

                        for (let j = 0; j < headers.length; j++) {
                            rowObj[headers[j]] = String(rawData[i][j]).trim();
                        }

                        if (dateColIdx !== -1 && rawDataTyped[i]) {
                            const rawDateVal = rawDataTyped[i][dateColIdx];
                            if (typeof rawDateVal === 'number') {
                                rowObj['Date'] = XLSX.SSF.format('dd-mm-yyyy', rawDateVal);
                            }
                        }

                        parsedData.push(rowObj);
                    }

                    // ROLE SUMMARY TABLE MAPPING =================
                    const roleMapping = {
                        'Hetvi Shah': 'AI Developer',
                        'Madhav Javeri': 'MEAN Stack Developer',
                        'Onkar Lonare': 'DevOps Engineer',
                        'Shubham Sonawane': 'Quality Engineer',
                        'Tanmay Shah': 'Scrum Master',
                        'Sneha Kasar': 'Frontend Developer'
                    };

                    // Index roleMapping by first name so its keys can be written as either a
                    // bare first name ("Hetvi") or a full name ("Hetvi Shah") - only the first
                    // name is ever used to match or display a person, so middle names, initials,
                    // and last-name spelling differences between this map and the Excel export
                    // (e.g. "Tanmay Shah" here vs "Tanmay P Shah" in the file) can't break matching.
                    const roleByFirstName = {};
                    for (const key in roleMapping) {
                        const firstName = key.trim().split(/\s+/)[0];
                        roleByFirstName[firstName.toLowerCase()] = { firstName, role: roleMapping[key] };
                    }

                    const unmatchedUserNames = new Set();

                    function getValidUserBaseName(name) {
                        if (!name) return null;
                        const firstToken = name.trim().split(/\s+/)[0].toLowerCase();
                        const match = roleByFirstName[firstToken];
                        if (match) return match.firstName;
                        unmatchedUserNames.add(name.trim());
                        return null; // Excludes users not explicitly defined in roleMapping
                    }

                    function getRole(firstName) {
                        const match = roleByFirstName[String(firstName || '').toLowerCase()];
                        return match ? match.role : 'Team Member';
                    }

                    function timeToHours(s) {
                        if (!s || s === '-' || s === 'undefined') return 0;
                        if (String(s).includes(':')) {
                            let parts = String(s).split(':');
                            return parseInt(parts[0] || 0) + parseInt(parts[1] || 0) / 60;
                        }
                        return parseFloat(s) || 0;
                    }

                    // Filter for Billable Types AND also include Holiday/Leave ones correctly.
                    // Saturday and Sunday are NOT special-cased - a day (any day) only becomes
                    // a column at all if someone actually logged an entry against it, decided
                    // purely from the dates present in the file (see uniqueDates below).
                    // Also tally hours dropped by each individual rule (Rejected, unrecognized
                    // user) so a "my total doesn't match Zoho's" question can be answered
                    // exactly, instead of requiring a guess-and-check round trip.
                    let rejectedExcludedHours = 0;
                    let unmatchedUserExcludedHours = 0;

                    const filteredData = parsedData.filter(row => {
                        const isBillable = row['Billing Type'] === 'Billable';
                        const taskName = String(row['Task/General/Issue'] || '').toLowerCase();
                        const isHolidayOrLeave = taskName.includes('holiday') || taskName.includes('leave');
                        if (!isBillable && !isHolidayOrLeave) return false; // not a billing/leave candidate at all

                        const validUser = getValidUserBaseName(String(row['User'] || ''));
                        if (validUser === null) {
                            unmatchedUserExcludedHours += timeToHours(row['Client Claim Daily Log']);
                            return false;
                        }

                        if (row['Approval Status'] === 'Rejected') {
                            rejectedExcludedHours += timeToHours(row['Client Claim Daily Log']);
                            return false;
                        }

                        return true;
                    });

                    if (rejectedExcludedHours > 0 || unmatchedUserExcludedHours > 0) {
                        let excludedMsg = "Hours excluded from this report's totals:\n";
                        if (rejectedExcludedHours > 0) excludedMsg += `\n- ${rejectedExcludedHours.toFixed(2)}h from Rejected entries`;
                        if (unmatchedUserExcludedHours > 0) excludedMsg += `\n- ${unmatchedUserExcludedHours.toFixed(2)}h logged by users not in the recognized team list`;
                        showToast(excludedMsg, 'info');
                    }

                    function formatHeaderDate(dateStr) {
                        const parts = dateStr.split('-');
                        if (parts.length === 3) {
                            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                            return `${parts[0]}/${months[parseInt(parts[1]) - 1]}`;
                        }
                        return dateStr;
                    }

                    function formatFullTitleDate(dateStr) {
                        const parts = dateStr.split('-');
                        if (parts.length === 3) {
                            const realMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                            return `${parseInt(parts[0])} ${realMonths[parseInt(parts[1]) - 1]} ${parts[2]}`;
                        }
                        return dateStr;
                    }

                    function formatPdfFileNameDate(dateStr) {
                        const parts = dateStr.split('-');
                        if (parts.length === 3) {
                            const months = ["Jan", "Feb", "March", "April", "May", "June", "July", "Aug", "Sep", "Oct", "Nov", "Dec"];
                            return `${parseInt(parts[0])}${months[parseInt(parts[1]) - 1]}${parts[2]}`;
                        }
                        return dateStr;
                    }

                    function getDayName(dateStr) {
                        const parts = dateStr.split('-');
                        if (parts.length === 3) {
                            const d = new Date(parts[2], parts[1] - 1, parts[0]);
                            return d.toLocaleDateString('en-US', { weekday: 'long' });
                        }
                        return '';
                    }

                    // Group by User -> Task -> Date
                    const groupedData = {};
                    const taskDisplayNames = {}; // normalized task key -> original display text

                    filteredData.forEach(row => {
                        const rawUserName = row['User'];
                        // Standardize the user name strictly to the stated name in our mapping
                        const user = getValidUserBaseName(rawUserName);
                        const rawTask = row['Task/General/Issue'];
                        const date = row['Date'];
                        const hours = timeToHours(row['Client Claim Daily Log']);

                        // Ignore empty users or tasks, or users not implicitly stated
                        if (!user) return;
                        if (!rawTask || rawTask === '-' || String(rawTask).trim() === '') return;

                        // Normalize the task key so the same task typed with different
                        // casing/whitespace on different days doesn't split into separate rows.
                        const task = String(rawTask).trim().toLowerCase();
                        if (!(task in taskDisplayNames)) taskDisplayNames[task] = String(rawTask).trim();

                        if (!groupedData[user]) groupedData[user] = {};
                        if (!groupedData[user][task]) groupedData[user][task] = {};
                        if (groupedData[user][task][date] === undefined) groupedData[user][task][date] = 0;

                        groupedData[user][task][date] += hours;
                    });

                    if (unmatchedUserNames.size > 0) {
                        showToast("Note: entries for the following user(s) were skipped because they are not in the recognized team list, and were NOT included in the report:\n\n" + Array.from(unmatchedUserNames).join('\n'), 'warning');
                    }

                    if (Object.keys(groupedData).length === 0) {
                        showToast("No billable entries were found for any recognized team member in this file. Please check the file and try again.", 'error');
                        return;
                    }

                    // Extract unique ordered dates strictly from entries that actually have a
                    // valid task recorded against them (i.e. from groupedData, not the wider
                    // filteredData). A row that passed the billable/user checks above but had a
                    // blank "Task/General/Issue" would otherwise still contribute its date here,
                    // producing a phantom all-blank column (e.g. a stray Sunday row with no task).
                    const dateSet = new Set();
                    Object.values(groupedData).forEach(userTasks => {
                        Object.values(userTasks).forEach(taskDates => {
                            Object.keys(taskDates).forEach(d => dateSet.add(d));
                        });
                    });
                    const uniqueDates = Array.from(dateSet).sort((a, b) => {
                        const [d1, m1, y1] = a.split('-');
                        const [d2, m2, y2] = b.split('-');
                        if (y1 !== y2) return y1 - y2;
                        if (m1 !== m2) return m1 - m2;
                        return d1 - d2;
                    });

                    const malformedDates = uniqueDates.filter(d => !/^\d{2}-\d{2}-\d{4}$/.test(d));
                    if (malformedDates.length > 0) {
                        showToast("Warning: some dates in the file are not in the expected DD-MM-YYYY format and may not display correctly:\n\n" + malformedDates.join(', '), 'warning');
                    }

                    // Longer date ranges add more fixed-width day columns, which squeezes the
                    // Tasks column and inflates row heights (and PDF page count). Shrink the
                    // per-user tables once the range exceeds a normal work week.
                    const wideRangeClass = uniqueDates.length > 6 ? ' compact-table' : '';

                    const rangeStartDate = officialPeriodStart || (uniqueDates.length > 0 ? uniqueDates[0] : '');
                    const rangeEndDate = officialPeriodEnd || (uniqueDates.length > 0 ? uniqueDates[uniqueDates.length - 1] : '');

                    let weekStartStr = rangeStartDate ? formatFullTitleDate(rangeStartDate) : '';
                    let weekEndStr = rangeEndDate ? formatFullTitleDate(rangeEndDate) : '';

                    let pdfStartStr = rangeStartDate ? formatPdfFileNameDate(rangeStartDate) : '';
                    let pdfEndStr = rangeEndDate ? formatPdfFileNameDate(rangeEndDate) : '';

                    window.pdfExportFileName = `${pdfStartStr}-${pdfEndStr} Timesheet.pdf`;
                    window.pdfReportRangeText = `Multiverz Weekly Timesheet | ${weekStartStr} to ${weekEndStr}`;

                    let allTablesHTML = `
                        <div style="text-align: center; margin-bottom: 25px; padding-top: 0px;">
                            <img src="${WISHTREE_LOGO_DATA_URI}" alt="Wishtree Technologies" style="height: 34px; width: auto; margin-bottom: 10px;" />
                            <h2 style="margin: 0; font-size: 1.8rem; color: #111827; font-weight: 700;">Multiverz - Challenges.one Weekly Timesheets</h2>
                            <p style="margin: 4px 0 0; font-size: 1.1rem; color: #4F46E5; font-weight: 600; text-transform: capitalize;">${weekStartStr} to ${weekEndStr}</p>
                        </div>
                    `;

                    const users = Object.keys(groupedData).sort();

                    // Weekend columns (Saturday or Sunday) only ever appear because someone
                    // actually logged a real entry against that date - when one shows up, spell
                    // out exactly which entry is driving it, so it's obvious whether that's
                    // genuine weekend work or a data entry mistake worth checking in the source.
                    const weekendNotes = [];
                    uniqueDates.forEach(d => {
                        const dayName = getDayName(d);
                        if (dayName !== 'Saturday' && dayName !== 'Sunday') return;
                        const contributors = [];
                        users.forEach(user => {
                            Object.keys(groupedData[user]).forEach(task => {
                                if (d in groupedData[user][task]) {
                                    contributors.push(`${user} - ${taskDisplayNames[task]} (${groupedData[user][task][d].toFixed(2)}h)`);
                                }
                            });
                        });
                        if (contributors.length > 0) {
                            weekendNotes.push(`${formatFullTitleDate(d)} (${dayName}): ${contributors.join('; ')}`);
                        }
                    });
                    if (weekendNotes.length > 0) {
                        showToast("Weekend entries found in this file - this is why a weekend column appears in the report:\n\n" + weekendNotes.join('\n'), 'info');
                    }

                    // --- BUILD ROLE SUMMARY TO PLACE AFTER TITLE --- //
                    let summaryHTML = '<div style="margin-top: 20px; text-align: center; display: flex; flex-direction: column; align-items: center;">';
                    summaryHTML += '<h2 class="results-title" style="margin-bottom: 12px; font-size: 1.3rem;">Role Summary</h2>';
                    summaryHTML += '<table style="max-width: 500px; margin-bottom: 20px; margin-left: auto; margin-right: auto;"><thead>';
                    summaryHTML += '<tr class="second-header-row"><th style="background-color: #A3B5C9; color: #111827; font-weight: 600; font-style: normal; text-align: left;">User</th><th style="background-color: #A3B5C9; color: #111827; font-weight: 600; font-style: normal; text-align: left;">Role</th><th style="background-color: #A3B5C9; color: #111827; text-align: right; font-weight: 600; font-style: normal;">Total Hours</th></tr>';
                    summaryHTML += '</thead><tbody>';

                    let grandTotalRoles = 0;
                    let emailSummaryRows = '';

                    users.forEach(user => {
                        let userWeeklyTotal = 0;
                        const tasks = Object.keys(groupedData[user]);
                        tasks.forEach(task => {
                            Object.values(groupedData[user][task]).forEach(hours => {
                                userWeeklyTotal += hours;
                            });
                        });
                        grandTotalRoles += userWeeklyTotal;

                        summaryHTML += '<tr>';
                        summaryHTML += `<td style="text-align: left;">${user}</td>`;
                        summaryHTML += `<td style="text-align: left;">${getRole(user)}</td>`;
                        summaryHTML += `<td style="text-align: right;">${userWeeklyTotal.toFixed(2)}</td>`;
                        summaryHTML += '</tr>';

                        // Add to email HTML layout using solid dark borders
                        emailSummaryRows += `<tr>
                            <td style="border: 1px solid #6b7280; padding: 6px 12px;">${user}</td>
                            <td style="border: 1px solid #6b7280; padding: 6px 12px;">${getRole(user)}</td>
                            <td style="border: 1px solid #6b7280; padding: 6px 12px; text-align: right;">${userWeeklyTotal.toFixed(2)}</td>
                        </tr>`;
                    });

                    summaryHTML += '<tr class="total-row" style="background-color: #DDE3EA;">';
                    summaryHTML += `<td colspan="2" style="text-align: right;"><b>Total </b></td>`;
                    summaryHTML += `<td style="text-align: right;"><b>${grandTotalRoles.toFixed(2)}</b></td>`;
                    summaryHTML += '</tr>';
                    summaryHTML += '</tbody></table></div>';

                    // Append the Executive Summary to the Title right away (This is Page 1)
                    allTablesHTML += summaryHTML;

                    // Each user's task list is split into page-sized chunks (each its own
                    // <table> with a repeated header, since html2pdf can't repeat a <thead>
                    // across pages on its own) by measuring actual rendered row heights in the
                    // DOM rather than assuming a fixed row count - row height varies a lot with
                    // wrapped task text, and a fixed count needs re-tuning whenever styling
                    // changes.
                    //
                    // PAGE_HEIGHT_BUDGET_PX is the usable content height (CSS px) of one
                    // html2pdf page for this element and export config (A4 landscape, 0.4in
                    // margins, scale 2), calibrated against this app's actual ~920px-wide report
                    // table rather than a synthetic proxy: html2pdf/jsPDF scale the whole
                    // captured image to fit the page width, so the effective height budget
                    // scales with the captured element's own width. The 60px reserve covers the
                    // trailing Grand Total/Total Hours rows appended to the last chunk.
                    const PAGE_HEIGHT_BUDGET_PX = 980 - 60;

                    const userTaskLists = {};
                    users.forEach(user => {
                        userTaskLists[user] = Object.keys(groupedData[user]).sort((a, b) => taskDisplayNames[a].localeCompare(taskDisplayNames[b]));
                    });

                    // Pass 1: render one full (unchunked) table per user so real row heights -
                    // which vary a lot with wrapped task text - can be measured in Pass 2. The
                    // results section is shown early so this has real layout to measure against;
                    // it's overwritten with the final chunked HTML before anything is painted,
                    // so nothing unchunked is ever visible.
                    let measureHTML = '';
                    users.forEach(user => {
                        measureHTML += `<table class="${wideRangeClass.trim()}" data-measure-user="${user}"><thead>`;
                        measureHTML += `<tr><th colspan="1" style="background-color: #DDE3EA; border: 1px solid #111827; text-align: left;">User - ${user}</th>`;
                        measureHTML += `<th colspan="${uniqueDates.length}" style="background-color: #DDE3EA; border: 1px solid #111827; text-align: left;">Role - ${getRole(user)}</th></tr>`;
                        measureHTML += '<tr class="second-header-row"><th style="width: auto;">Tasks</th>';
                        uniqueDates.forEach(d => {
                            const isWeekend = getDayName(d) === 'Saturday' || getDayName(d) === 'Sunday';
                            measureHTML += `<th class="${isWeekend ? 'weekend-col' : ''}" style="width: 1%; white-space: nowrap; text-align: center;">${formatHeaderDate(d)} <br>(${getDayName(d)})</th>`;
                        });
                        measureHTML += '</tr></thead><tbody>';
                        userTaskLists[user].forEach(task => {
                            measureHTML += '<tr>';
                            measureHTML += `<td>${taskDisplayNames[task]}</td>`;
                            uniqueDates.forEach(d => {
                                if (d in groupedData[user][task]) {
                                    measureHTML += `<td style="text-align: right; width: 1%; white-space: nowrap;">${groupedData[user][task][d].toFixed(2)}</td>`;
                                } else {
                                    measureHTML += `<td style="width: 1%; white-space: nowrap;"></td>`;
                                }
                            });
                            measureHTML += '</tr>';
                        });
                        measureHTML += '</tbody></table>';
                    });
                    document.getElementById('tableContainer').innerHTML = `<div style="padding: 0px 5px; box-sizing: border-box; width: 100%;">${measureHTML}</div>`;
                    document.getElementById('resultsSection').style.display = 'block';

                    // Pass 2: measure, and greedily pack rows into page-height-budgeted chunks.
                    const userChunkPlans = {};
                    document.querySelectorAll('#tableContainer table[data-measure-user]').forEach(tableEl => {
                        const user = tableEl.getAttribute('data-measure-user');
                        const tasks = userTaskLists[user];
                        const headerHeight = Array.from(tableEl.querySelectorAll('thead tr'))
                            .reduce((sum, tr) => sum + tr.getBoundingClientRect().height, 0);
                        const rowEls = tableEl.querySelectorAll('tbody tr');
                        const chunks = [];
                        let currentChunk = [];
                        let currentHeight = headerHeight;
                        rowEls.forEach((rowEl, idx) => {
                            const rowHeight = rowEl.getBoundingClientRect().height;
                            if (currentChunk.length > 0 && currentHeight + rowHeight > PAGE_HEIGHT_BUDGET_PX) {
                                chunks.push(currentChunk);
                                currentChunk = [];
                                currentHeight = headerHeight;
                            }
                            currentChunk.push(tasks[idx]);
                            currentHeight += rowHeight;
                        });
                        if (currentChunk.length > 0) chunks.push(currentChunk);
                        if (chunks.length === 0) chunks.push([]);
                        userChunkPlans[user] = chunks;
                    });

                    // Pass 3: build the final chunked HTML using the measured chunk boundaries.
                    users.forEach((user) => {
                        const tasks = userTaskLists[user];

                        // Compute per-date totals across ALL of this user's tasks up front, so
                        // the Grand Total row is correct no matter which page chunk it lands on.
                        let userTotalPerDate = {};
                        let hasDataPerDate = {};
                        uniqueDates.forEach(d => { userTotalPerDate[d] = 0; hasDataPerDate[d] = false; });
                        tasks.forEach(task => {
                            uniqueDates.forEach(d => {
                                if (d in groupedData[user][task]) {
                                    userTotalPerDate[d] += groupedData[user][task][d];
                                    hasDataPerDate[d] = true;
                                }
                            });
                        });
                        let weekTotal = 0;
                        uniqueDates.forEach(d => { weekTotal += userTotalPerDate[d]; });

                        const chunks = userChunkPlans[user];

                        chunks.forEach((chunkTasks, chunkIdx) => {
                            const isLastChunk = chunkIdx === chunks.length - 1;
                            let tableHTML = '';

                            // Break EVERY chunk onto its own new page.
                            tableHTML += '<div class="html2pdf__page-break" style="page-break-before: always; clear: both; padding-top: 10px;"></div>';

                            tableHTML += `<table class="${wideRangeClass.trim()}" style="margin-bottom: 40px;"><thead>`;

                            const userLabel = chunkIdx === 0 ? user : `${user} (continued)`;
                            tableHTML += `<tr><th colspan="1" style="background-color: #DDE3EA; border: 1px solid #111827; text-align: left;">User - ${userLabel}</th>`;
                            tableHTML += `<th colspan="${uniqueDates.length}" style="background-color: #DDE3EA; border: 1px solid #111827; text-align: left;">Role - ${getRole(user)}</th></tr>`;

                            tableHTML += '<tr class="second-header-row"><th style="width: auto;">Tasks</th>';
                            uniqueDates.forEach(d => {
                                const isWeekend = getDayName(d) === 'Saturday' || getDayName(d) === 'Sunday';
                                tableHTML += `<th class="${isWeekend ? 'weekend-col' : ''}" style="width: 1%; white-space: nowrap; text-align: center;">${formatHeaderDate(d)} <br>(${getDayName(d)})</th>`;
                            });
                            tableHTML += '</tr></thead><tbody>';

                            chunkTasks.forEach(task => {
                                tableHTML += '<tr>';
                                tableHTML += `<td>${taskDisplayNames[task]}</td>`;

                                uniqueDates.forEach(d => {
                                    if (d in groupedData[user][task]) {
                                        const hours = groupedData[user][task][d];
                                        tableHTML += `<td style="text-align: right; width: 1%; white-space: nowrap;">${hours.toFixed(2)}</td>`;
                                    } else {
                                        tableHTML += `<td style="width: 1%; white-space: nowrap;"></td>`;
                                    }
                                });
                                tableHTML += '</tr>';
                            });

                            if (isLastChunk) {
                                // Footer Total Row
                                tableHTML += '<tr class="total-row">';
                                tableHTML += `<td><b>Grand Total</b></td>`;
                                uniqueDates.forEach(d => {
                                    if (hasDataPerDate[d]) {
                                        tableHTML += `<td style="text-align: right; width: 1%; white-space: nowrap;"><b>${userTotalPerDate[d].toFixed(2)}</b></td>`;
                                    } else {
                                        tableHTML += `<td style="width: 1%; white-space: nowrap;"></td>`;
                                    }
                                });
                                tableHTML += '</tr>';

                                // Total per user row
                                tableHTML += '<tr class="total-row" style="background-color: #DDE3EA;">';
                                tableHTML += `<td colspan="${uniqueDates.length}" style="text-align: right;"><b>Total Hours</b></td>`;
                                tableHTML += `<td style="text-align: right;"><b>${weekTotal.toFixed(2)}</b></td>`;
                                tableHTML += '</tr>';
                            }

                            tableHTML += '</tbody></table>';

                            allTablesHTML += tableHTML;
                        });
                    });

                    // The Role Summary has already been built and placed at the top above.

                    // Wrap the complete container softly to ensure PDF scaling natively fits
                    // without hitting the exact zero-pixel edge and causing right/top clipping.
                    allTablesHTML = `<div style="padding: 0px 5px; box-sizing: border-box; width: 100%;">${allTablesHTML}</div>`;

                    document.getElementById('tableContainer').innerHTML = allTablesHTML;
                    document.getElementById('resultsSection').style.display = 'block';

                    // Build and show the email draft
                    let mailSubj = `Weekly Timesheet (${weekStartStr} to ${weekEndStr})`;
                    let mailContentHeader = `Hi Randeep Sir,<br><br>Please find our weekly timesheet submission for the Multiverz | Challenge One Platform project, covering the period of ${weekStartStr} to ${weekEndStr}.<br><br><b>Resource Summary</b>`;

                    let mailTable = `
                        <table style="width: auto; min-width: 400px; border-collapse: collapse; margin-top: 8px; margin-bottom: 16px; font-family: Arial, sans-serif; border: 1px solid #6b7280;">
                            <thead>
                                <tr style="background-color: #f3f4f6;">
                                    <th style="border: 1px solid #6b7280; padding: 6px 12px; text-align: left; font-weight: bold;">User</th>
                                    <th style="border: 1px solid #6b7280; padding: 6px 12px; text-align: left; font-weight: bold;">Role</th>
                                    <th style="border: 1px solid #6b7280; padding: 6px 12px; text-align: right; font-weight: bold;">Total Hours</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${emailSummaryRows}
                                <tr style="background-color: #f9fafb;">
                                    <td colspan="2" style="border: 1px solid #6b7280; padding: 6px 12px; text-align: right;"><b>Total </b></td>
                                    <td style="border: 1px solid #6b7280; padding: 6px 12px; text-align: right;"><b>${grandTotalRoles.toFixed(2)}</b></td>
                                </tr>
                            </tbody>
                        </table>
                    `;

                    let mailFooter = `The detailed timesheet is attached for your review and approval.`;

                    document.getElementById('emailSubjectContent').innerText = mailSubj;
                    document.getElementById('emailBodyContent').innerHTML = mailContentHeader + mailTable + mailFooter;
                    document.getElementById('emailDraftBox').style.display = 'block';

                } catch (err) {
                    console.error(err);
                    showToast("There was an error parsing the file: " + err.message, 'error');
                } finally {
                    uploadLoading.classList.remove('active');
                    uploadIdle.style.display = '';
                    // Reset file input to allow re-upload of the same file, even after an error
                    fileInput.value = '';
                }
            };

            reader.readAsArrayBuffer(file);
        });

        function copyTable(btn) {
            const tableContainer = document.getElementById('tableContainer');
            const range = document.createRange();
            range.selectNode(tableContainer);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            try {
                // Execute copy
                document.execCommand('copy');
                showCopyFeedback(btn);
            } catch (err) {
                showToast('Failed to copy table. Please copy it manually.', 'error');
            }
            selection.removeAllRanges(); // Deselect
        }

        function copyEmailSubject(btn) {
            const subjectText = document.getElementById('emailSubjectContent').innerText;
            navigator.clipboard.writeText(subjectText).then(() => {
                showCopyFeedback(btn);
            }).catch(() => {
                showToast('Failed to copy subject. Please copy it manually.', 'error');
            });
        }

        function copyEmailBody(btn, silent = false) {
            const emailBodyContent = document.getElementById('emailBodyContent');

            // 1. Synchronous Native Copy (Works universally when user gesture is active)
            const range = document.createRange();
            range.selectNodeContents(emailBodyContent); // Selecting contents directly fixes div wrapper clipping bugs
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            try {
                document.execCommand('copy');
                if (!silent) showCopyFeedback(btn);
            } catch (err) {
                if (!silent) showToast('Failed to copy email body natively. Please select and copy it manually.', 'error');
            }
            selection.removeAllRanges(); // Deselect

            // 2. Modern Async Clipboard Override (Guarantees true, rich raw HTML blob mapping in modern engines like Chrome)
            if (navigator.clipboard && window.ClipboardItem) {
                const htmlBlob = new Blob([emailBodyContent.innerHTML], { type: 'text/html' });
                const textBlob = new Blob([emailBodyContent.innerText], { type: 'text/plain' });
                navigator.clipboard.write([new ClipboardItem({
                    'text/html': htmlBlob,
                    'text/plain': textBlob
                })]).catch(e => console.log('Modern clipboard override skipped', e));
            }
        }

        function openAndCopyGmail() {
            // First SILENTLY invoke the bulletproof dual-layer copy protocol while the UI event is synchronous
            copyEmailBody(null, true);

            // Fetch the generated Subject text
            const subjectText = document.getElementById('emailSubjectContent').innerText;

            // Generate the secure Gmail compose URL explicitly routing the Subject
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&su=${encodeURIComponent(subjectText)}`;

            // Open Gmail asynchronously tightly mapped to the click event to avoid popup blockers
            window.open(gmailUrl, '_blank');

            // Give the UI a moment to transition to the new tab before notifying
            setTimeout(() => {
                showToast("Gmail is opening! The fully formatted timesheet table is on your clipboard - click into the email body and press Ctrl+V to paste it.", 'info');
            }, 500);
        }

        function exportPDF() {
            // Scroll to top to eliminate Phantom Margin bugs induced by window scroll offsets
            const originalScrollY = window.scrollY;
            window.scrollTo(0, 0);

            const element = document.getElementById('tableContainer');

            const dynamicName = window.pdfExportFileName || 'Timesheets.pdf';
            const footerRangeText = window.pdfReportRangeText || '';

            const opt = {
                margin: [0.4, 0.4, 0.4, 0.4],
                filename: dynamicName,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' },
                // Explicitly avoid only table rows! This stops the engine from pushing the
                // ENTIRE first table to page 2 if it's too long to fit alongside the main Title.
                pagebreak: { mode: 'css', avoid: 'tr' }
            };

            html2pdf().set(opt).from(element).toPdf().get('pdf').then((pdf) => {
                // Stamp a footer (report identification + page number) on every page, since a
                // long multi-page export otherwise has no way to tell which page belongs to
                // which report if pages are separated or printed loose.
                const pageCount = pdf.internal.getNumberOfPages();
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                for (let i = 1; i <= pageCount; i++) {
                    pdf.setPage(i);
                    pdf.setFontSize(8);
                    pdf.setTextColor(120, 120, 120);
                    pdf.text(footerRangeText, 0.4, pageHeight - 0.2);
                    pdf.text(`Page ${i} of ${pageCount}`, pageWidth - 0.4, pageHeight - 0.2, { align: 'right' });
                }
            }).save().then(() => {
                window.scrollTo(0, originalScrollY);
            });
        }
    </script>
